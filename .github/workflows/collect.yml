name: news-collector
on:
  schedule:
    # ٣/٩/٢٠٢٦ — «*/15» لم تُطلق ولا مرة (٨ تشغيلات كلها يدوية). جدولة جيتهب
    # طابور مشترك: الصيغ الكثيفة تُسقَط، ورأس الساعة أكثر الأوقات ازدحاماً.
    # ثلاث مرات فى الساعة على دقائق غير مستديرة = فرصة أعلى بكثير للالتقاط.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
concurrency:
  group: news-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        run: python3 collect_news.py
