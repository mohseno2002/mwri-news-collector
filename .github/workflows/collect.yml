name: news-collector
on:
  schedule:
    # ٥/٩/٢٠٢٦ — الجدولة هنا **مُعيد إشعال** لا ساعة: قياس اليوم أثبت أن
    # `*/5` أطلقت ثلاث مرات فى ١٢ ساعة (٠١:٠١ · ٠٥:٤٨ · ١١:١٦ UTC)، فالطلب
    # اليدوى من زر التطبيق كان يموت (عمره ٢٠ دقيقة) قبل أن تلتقطه أى جولة.
    # الساعة الحقيقية الآن سلسلة جولات: كل جولة تبقى ~٢٥ دقيقة تراقب العقدة
    # كل ٢٠ ث (watch_loop.py) ثم تُطلق التالية بـworkflow_dispatch عبر
    # GITHUB_TOKEN المدمج — بلا أى سرّ مخزَّن. لو انقطعت السلسلة لأى سبب
    # تعيد الجدولة إشعالها فى أول إطلاق يصل.
    # مجموعة concurrency: جولة واحدة تعمل + واحدة بالانتظار على الأكثر،
    # وأى انتظار أقدم يُلغى تلقائياً — فلا سلسلتان أبداً.
    # الحمل على جوجل لم يتغيّر: collect_news.py يقرّر الجمع بنفس البوابة
    # (٢٥ دقيقة أو طلب يدوى)؛ الذى تغيّر أن البوابة تُسأل كل ٢٠ ث لا كل بضع
    # ساعات. الحارس يقرأ ثلاثة أوراق صغيرة من العقدة لا العقدة كلها.
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: news-collector
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: watch (~25 min) and collect when due
        env:
          WATCH_RUN_SEC: "1500"
          WATCH_POLL_SEC: "20"
        run: python3 watch_loop.py
      - name: chain next round
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME:-main}" --repo "$GITHUB_REPOSITORY"
