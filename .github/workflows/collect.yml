name: news-collector
on:
  schedule:
    # ٣/٩/٢٠٢٦ — كل ساعة بقرار م. محسن. هذا مجمّع **احتياطى**: الأساسى هو
    # وركر كلاودفلير (١٥ دقيقة نهاراً و٣٠ ليلاً). كل جولة هنا تقرأ العقدة
    # كاملة (~٠٫٩٣ م.ب) للدمج ثم تكتبها، فـ٧٢ جولة/يوم كانت تضيف ٢ جيجا/شهر
    # على حصة Spark المجانية (سقفها ١٠) بلا مكسب — أصغر عمر لخبر يصلنا
    # ساعتان بحكم فهرسة جوجل. الدقيقة ١٧ تتفادى ذروة رأس الساعة فى Actions.
    # ٥/٩/٢٠٢٦ — تُرقّى هذه المهمة إلى المجمّع الأساسى. السبب مقيس: جوجل
    # تخدم كل استعلاماتنا بلا مشكلة من مخرج عادى (٦٩ · ٤٩ · ٤٨ · ٤٣ عنصراً
    # للزوايا التى تُرفض من كلاودفلير)، وتحجب مخرجَى وركر كلاودفلier ودالة
    # Supabase وحدهما. جولتان فى الساعة: ١٠ زوايا جوجل للجولة = ٤٨٠ طلباً
    # يومياً، بعيداً عن الحدّ الخطر الموثّق ٣/٩ (~٢٨٠٠ يسقط المخرج كله).
    # الدقيقتان ٢ و٣٢ تتفاديان ذروة رأس الساعة فى Actions.
    # ٥/٩/٢٠٢٦ — كل خمس دقائق **نبضة بوابة** لا جولة جمع. المهمة تقرأ عقدة
    # /mwri/jobs وتخرج فى ثوانٍ إلا إذا مرّ ٢٥ دقيقة على آخر جمع أو وُجد طلب
    # يدوى من زر التطبيق. الجمع الفعلى يظل ~جولتين فى الساعة، فالحمل على
    # جوجل لا يتغيّر. المستودع عام فدقائق Actions بلا حدّ.
    # الغاية: زر تحديث يعمل بلا تخزين أى سرّ فى أى مكان.
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: news-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        run: python3 collect_news.py
